services:
    registry:
        build: ./
        restart: always
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=Registry
            - DB_USERNAME=root
            - DB_PASSWORD=password
            - SESSION_DRIVER=file
            - APP_ENV=production
            - APP_DEBUG=false
    mysql:
        image: mysql:8.0
        restart: always
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        environment:
            MYSQL_ROOT_PASSWORD: password
        volumes:
            - db_data:/var/lib/mysql
    nginx:
        image: nginx:alpine
        restart: always
        ports:
            - "80:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - registry
volumes:
    db_data:
