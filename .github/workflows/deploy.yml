name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/registry
            cd /home/ubuntu/registry
            git clone https://github.com/Must01/Registry.git . || git pull
            cat > .env << 'EOF'
            APP_KEY=${{ secrets.APP_KEY }}
            APP_ENV=production
            APP_DEBUG=false
            DB_CONNECTION=mysql
            DB_HOST=mysql
            DB_PORT=3306
            DB_DATABASE=Registry
            DB_USERNAME=root
            DB_PASSWORD=password
            SESSION_DRIVER=file
            EOF
            docker compose down 2>/dev/null || true
            docker compose up -d --build
            sleep 10
            docker compose exec -T registry php artisan storage:link || true
            docker compose exec -T registry php artisan migrate --force || true
